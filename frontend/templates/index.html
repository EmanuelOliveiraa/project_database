<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Registrar Nova Venda</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f6f8; color: #333; display: flex; justify-content: center; padding: 40px 20px; }
        .container { background: white; padding: 28px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { margin-top: 0; font-size: 1.4rem; border-bottom: 1px solid #eee; padding-bottom: 12px; }
        .campo { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
        select, input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        .linha-dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 8px; }
        button:hover { background: #1d4ed8; }
        .alerta { padding: 12px; border-radius: 6px; margin-bottom: 18px; font-weight: 500; }
        .sucesso { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
        .erro { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nova Venda</h1>

        {% if mensagem %}
            <div class="alerta {{ 'sucesso' if sucesso else 'erro' }}">
                {{ mensagem }}
            </div>
        {% endif %}

        <form method="POST" action="/venda">
            <div class="campo">
                <label for="clicodigo">Cliente</label>
                <select name="clicodigo" id="clicodigo" required>
                    <option value="">-- Selecione o cliente --</option>
                    {% for c in clientes %}
                        <option value="{{ c.id }}">{{ c.nome }} (Cód: {{ c.id }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="campo">
                <label for="funcodigo">Vendedor</label>
                <select name="funcodigo" id="funcodigo" required>
                    <option value="">-- Selecione o vendedor --</option>
                    {% for v in vendedores %}
                        <option value="{{ v.id }}">{{ v.nome }} (Cód: {{ v.id }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="campo">
                <label for="produto_codigo">Produto</label>
                <select name="produto_codigo" id="produto_codigo" required>
                    <option value="">-- Selecione o produto --</option>
                    {% for p in produtos %}
                        <option value="{{ p.id }}">
                            {{ p.nome }} — R$ {{ "%.2f"|format(p.preco) }} (Estoque: {{ p.saldo }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="linha-dupla">
                <div class="campo">
                    <label for="itvqtde">Quantidade</label>
                    <input type="number" name="itvqtde" id="itvqtde" min="1" value="1" required>
                </div>

                <div class="campo">
                    <label for="fpcodigo">Forma de Pagamento</label>
                    <select name="fpcodigo" id="fpcodigo" required>
                        <option value="">-- Selecione --</option>
                        {% for fp in formas_pagamento %}
                            <option value="{{ fp.id }}">{{ fp.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="campo">
                <label for="filial">Filial</label>
                <select name="filial" id="filial" required>
                    <option value="">-- Selecione a filial --</option>
                    {% for f in filiais %}
                        <option value="{{ f.id }}">{{ f.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit">Confirmar Venda</button>
        </form>
    </div>
</body>
</html>
